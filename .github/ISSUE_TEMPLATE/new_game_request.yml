name: New Game / ROM Profile Request
description: Request MSOP support for a new MAME game.
title: "[NEW PROFILE] "
labels: ["enhancement", "new-profile"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a new game profile. Profiles are JSON files that the Database Compiler builds into the plugin's `database.lua`, so please provide as much memory address discovery as you can to expedite the addition.

        If you would like to write the profile yourself, the [MSOP Compiler & Plugin Guide](https://github.com/djGLiTCH/MAME-LUA-SCRIPT-STATE-OUTPUTS/blob/main/GUIDE.md) explains every key with worked examples, and a pull request with the JSON file is the fastest route.
  - type: checkboxes
    id: pre_flight
    attributes:
      label: Pre-Flight Checks
      options:
        - label: "I have checked the supported games table in the README and the [MSOP - Supported Games](https://docs.google.com/spreadsheets/d/17VVvfFBOEA-wKUkgWtro3O3fWqo9LeqYRcmX1Q6i5V4/edit?usp=sharing) spreadsheet, and this game is not already supported."
          required: true
        - label: "I have searched the existing open and closed issues for this ROM."
          required: true
  - type: input
    id: rom_name
    attributes:
      label: ROM Name
      description: The exact short name of the ROM (e.g. `alien3`, `timecris`).
    validations:
      required: true
  - type: input
    id: mame_version
    attributes:
      label: Tested MAME Version
      description: The MAME version where you identified or tested these memory addresses.
    validations:
      required: true
  - type: dropdown
    id: game_type
    attributes:
      label: Game Type
      description: Dictates which output vocabulary MSOP compiles for this ROM. Use `both` for hybrids that need the light gun pipeline as well as force feedback, such as a racing game with life or damage tracking.
      options:
        - lightgun
        - racing
        - both
    validations:
      required: true
  - type: textarea
    id: memory_addresses
    attributes:
      label: Known Memory Addresses
      description: |
        List any memory addresses you have already found.
        Most useful: `GAME_STATUS` (game-wide), then per player `STATUS`, `CREDITS`, `AMMO`, `LIFE`, `RECOIL`, `RELOAD`, `DAMAGE` and `LAMP_START`.
      placeholder: |
        GAME_STATUS: 0x...
        P1 STATUS: 0x...
        P1 AMMO: 0x...
        P1 LAMP_START: 0x...
    validations:
      required: false
  - type: textarea
    id: ffb_data
    attributes:
      label: FFB / Racing Data (If applicable)
      description: If the game has force feedback (`racing` or `both`), provide the FFB source address, decoding logic (e.g. `signed8`, `model2_bands`), and scale.
    validations:
      required: false
  - type: textarea
    id: native_outputs
    attributes:
      label: Native Driver Outputs
      description: List any native outputs generated by the MAME driver itself that should be forwarded via `ADDITIONAL_OUTPUT_FORWARDS`.
    validations:
      required: false
  - type: checkboxes
    id: testing
    attributes:
      label: Testing (Optional)
      options:
        - label: "I can test a Beta profile for this game on real hardware and report back."
          required: false
