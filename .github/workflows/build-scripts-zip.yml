name: Package Latest Scripts

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAME/**'
      - 'Hook Of The Reaper/**'
      - 'MAMEhooker/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare and Package ZIP
      run: |
        # Ensure the target directory exists
        mkdir -p Updater
        
        # Remove any existing zip to guarantee a clean package
        rm -f Updater/MAME-STATE-OUTPUT-PLUGIN-STABLE.zip
        
        # Zip the folders directly into the Updater directory
        zip -r Updater/MAME-STATE-OUTPUT-PLUGIN-STABLE.zip MAME "Hook Of The Reaper" "MAMEhooker"

    - name: Commit and push the new ZIP
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-package latest plugin files into zip file"
        file_pattern: 'Updater/MAME-STATE-OUTPUT-PLUGIN-STABLE.zip'