name: Package update ZIPs

# Packages the updates/ subfolder zips from the Database Compiler's COMMITTED, per-channel output. This is
# a pure PACKAGER - it runs no compilers. The owner builds output/<channel>/ locally
# (scripts/run_stable.* / run_beta.* / run.* do db compile + driver + both generators per channel; the
# driver's native_outputs_by_rom.lua needs a MAME source checkout CI does not have) and commits it; CI just zips.
#
#   STABLE (required - guard fails loudly if missing):
#     updates/plugin/MSOP-PLUGIN-STABLE.zip                  <- output/stable/stateoutput/     (stateoutput/ at zip root)
#     updates/mamehooker/MSOP-MAMEHOOKER-STABLE.zip          <- output/stable/ini/             (ini/ at zip root)
#     updates/hook-of-the-reaper/MSOP-HOTR-STABLE.zip        <- output/stable/defaultLG/       (defaultLG/ at zip root)
#     updates/database-compiler/MSOP-DATABASE-COMPILER.zip   <- the standalone tool (scripts + STABLE input/output + README)
#     updates/game-profiles/MSOP-GAME-PROFILES-STABLE.zip    <- input/stable/database/games/   (games/ at zip root)
#
#   BETA (owner-gated - packaged ONLY when output/beta/ has been committed; skipped otherwise):
#     updates/plugin/MSOP-PLUGIN-BETA.zip                    <- output/beta/stateoutput/
#     updates/mamehooker/MSOP-MAMEHOOKER-BETA.zip            <- output/beta/ini/
#     updates/hook-of-the-reaper/MSOP-HOTR-BETA.zip          <- output/beta/defaultLG/
#     updates/game-profiles/MSOP-GAME-PROFILES-BETA.zip      <- input/beta/database/games/
#
# The GAME-PROFILES zips carry each channel's official game profiles (_default.json plus the GAME_TYPE
# subfolders) so an app can compile a channel's database with the user's own profiles on top of it.
#
# Beta is deliberately manual: each beta channel's plugin/HOTR/INI are generated together from the SAME
# beta database (input/beta/), so a beta plugin can never be paired with stable-suited HOTR/INI. Run
# scripts/run_beta.* locally, commit output/beta/, and this workflow packages the BETA zips too.
#
# PREREQUISITE: the tools/database-compiler folder (incl. its committed output/stable/) must be
# COMMITTED - the guard step fails loudly until it is committed + pushed.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/database-compiler/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DBC: tools/database-compiler

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Guard - the committed STABLE output must be present
      run: |
        missing=0
        for f in "output/stable/stateoutput/database.lua" "output/stable/ini" "output/stable/defaultLG"; do
          if [ ! -e "$DBC/$f" ]; then
            echo "::error::'$DBC/$f' not found. Build the Database Compiler locally (scripts/run_stable.*) and commit + push its output/stable/ before this workflow can package the zips."
            missing=1
          fi
        done
        [ "$missing" = "0" ]
        # native_outputs_by_rom.lua is OPTIONAL: a MSOP-only build (scripts/run_stable_msop_only.*) intentionally
        # omits it, so its absence is a warning, not a failure - the STABLE plugin zip then ships MSOP-only.
        if [ ! -e "$DBC/output/stable/stateoutput/native_outputs_by_rom.lua" ]; then
          echo "::warning::output/stable/stateoutput/native_outputs_by_rom.lua not found - the STABLE plugin will ship WITHOUT MAME native output forwarding (MSOP-only). If unintended, run scripts/run_stable.* with MAME_SRC set."
        fi

    - name: Package the STABLE update ZIPs
      run: |
        mkdir -p updates/plugin updates/mamehooker updates/hook-of-the-reaper updates/database-compiler updates/game-profiles
        rm -f updates/plugin/MSOP-PLUGIN-STABLE.zip \
              updates/mamehooker/MSOP-MAMEHOOKER-STABLE.zip \
              updates/hook-of-the-reaper/MSOP-HOTR-STABLE.zip \
              updates/database-compiler/MSOP-DATABASE-COMPILER.zip \
              updates/game-profiles/MSOP-GAME-PROFILES-STABLE.zip
        # stateoutput/, ini/, defaultLG/ each sit at their zip's root (the app extracts expecting that).
        (cd "$DBC/output/stable" && zip -rX "$GITHUB_WORKSPACE/updates/plugin/MSOP-PLUGIN-STABLE.zip" stateoutput)
        (cd "$DBC/output/stable" && zip -rX "$GITHUB_WORKSPACE/updates/mamehooker/MSOP-MAMEHOOKER-STABLE.zip" ini)
        (cd "$DBC/output/stable" && zip -rX "$GITHUB_WORKSPACE/updates/hook-of-the-reaper/MSOP-HOTR-STABLE.zip" defaultLG)
        # The self-contained tool: scripts + STABLE input/output + README; beta stays internal (not shipped).
        (cd "$DBC" && zip -rX "$GITHUB_WORKSPACE/updates/database-compiler/MSOP-DATABASE-COMPILER.zip" scripts input/stable output/stable README.md -x '*__pycache__*')
        # The channel's official game profiles on their own, games/ at the zip root.
        (cd "$DBC/input/stable/database" && zip -rX "$GITHUB_WORKSPACE/updates/game-profiles/MSOP-GAME-PROFILES-STABLE.zip" games)

    - name: Package the BETA update ZIPs (only if beta output was committed)
      run: |
        if [ -f "$DBC/output/beta/stateoutput/database.lua" ]; then
          echo "beta output present -> packaging BETA zips"
          rm -f updates/plugin/MSOP-PLUGIN-BETA.zip \
                updates/mamehooker/MSOP-MAMEHOOKER-BETA.zip \
                updates/hook-of-the-reaper/MSOP-HOTR-BETA.zip \
                updates/game-profiles/MSOP-GAME-PROFILES-BETA.zip
          (cd "$DBC/output/beta" && zip -rX "$GITHUB_WORKSPACE/updates/plugin/MSOP-PLUGIN-BETA.zip" stateoutput)
          [ -d "$DBC/output/beta/ini" ]       && (cd "$DBC/output/beta" && zip -rX "$GITHUB_WORKSPACE/updates/mamehooker/MSOP-MAMEHOOKER-BETA.zip" ini)
          [ -d "$DBC/output/beta/defaultLG" ] && (cd "$DBC/output/beta" && zip -rX "$GITHUB_WORKSPACE/updates/hook-of-the-reaper/MSOP-HOTR-BETA.zip" defaultLG)
          [ -d "$DBC/input/beta/database/games" ] && (cd "$DBC/input/beta/database" && zip -rX "$GITHUB_WORKSPACE/updates/game-profiles/MSOP-GAME-PROFILES-BETA.zip" games)
          if [ ! -f "$DBC/output/beta/stateoutput/native_outputs_by_rom.lua" ]; then
            echo "::warning::output/beta/ has no native_outputs_by_rom.lua - the BETA plugin will ship without native output forwarding. Run scripts/run_beta.* with MAME_SRC set to include it."
          fi
        else
          echo "no beta output committed -> skipping BETA zips (beta is owner-gated)"
        fi

    - name: Commit and push the new ZIPs
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Auto-package Database Compiler outputs into updates subfolder zips (per channel)"
        file_pattern: 'updates/plugin/*.zip updates/mamehooker/*.zip updates/hook-of-the-reaper/*.zip updates/database-compiler/*.zip updates/game-profiles/*.zip'
